engine_id: docling
engine_version: "2.x"
config_id: docling_ocr_easyocr_vi_cpu
output_kind: document_ir
supports_pdf_text: true
supports_scanned_pdf: true
supports_images: true
supports_tables: true
supports_gpu: true
supports_multi_page: true
provides_bounding_boxes: true
license_name: MIT
enabled: true
device: cpu
options:
  benchmark_track: scan_ocr
  do_ocr: true
  ocr_engine: easyocr
  ocr_languages:
    - vi
    - en
  force_full_page_ocr: false
  do_table_structure: true
  generate_picture_images: false
  document_timeout_seconds: 300
  timeout_seconds: 300
